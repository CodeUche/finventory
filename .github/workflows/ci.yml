name: CI / CD

# Minimum token permissions — jobs that need more declare it explicitly.
permissions:
  contents: read

on:
  push:
    branches: [main, develop, "infra/aws-migration"]
    tags: ["v*.*.*"]
  pull_request:
    branches: [main, develop]

# Cancel in-progress CI runs when a new push arrives on the same ref.
# Deploy jobs use their own concurrency group (cancel-in-progress: false).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.13"
  NODE_VERSION: "20"

# ─── Backend — Lint ────────────────────────────────────────────────────────────
jobs:
  backend-lint:
    name: Backend — Lint & Type Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/requirements/development.txt

      - name: Install lint deps
        run: pip install flake8 black isort

      - name: flake8
        run: flake8 . --max-line-length=120 --exclude=migrations,venv --extend-ignore=E501,W503 || true

      - name: black (check only)
        run: black --check --line-length=120 . --exclude '/(migrations|venv)/' || true

      - name: isort (check only)
        run: isort --check-only --profile=black . || true

# ─── Backend — Tests ───────────────────────────────────────────────────────────
  backend-test:
    name: Backend — Tests & Coverage
    runs-on: ubuntu-latest
    needs: backend-lint

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: finventory_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: backend

    env:
      DJANGO_SETTINGS_MODULE: config.settings.testing
      DB_NAME: finventory_test
      DB_USER: test_user
      DB_PASSWORD: test_password
      DB_HOST: localhost
      DB_PORT: 5432
      REDIS_URL: redis://localhost:6379/0
      SECRET_KEY: ci-test-secret-key-not-for-production-use-at-all
      DEBUG: "False"

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/requirements/development.txt

      - name: Install dependencies
        run: pip install --upgrade pip && pip install -r requirements/development.txt

      - name: Check for missing migrations
        run: python manage.py migrate --check --no-input || true

      - name: Run migrations
        run: python manage.py migrate --no-input

      - name: Run tests with coverage
        run: |
          pytest \
            --cov=apps \
            --cov-report=xml \
            --cov-report=term-missing \
            --tb=short \
            -q \
            -v \
            --junitxml=test-results.xml

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-test-results
          path: backend/test-results.xml
          retention-days: 14

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        if: always()
        with:
          files: backend/coverage.xml
          fail_ci_if_error: false

# ─── Frontend — Type Check & Build ────────────────────────────────────────────
  frontend-build:
    name: Frontend — Type Check & Build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: TypeScript type check
        run: npx tsc --noEmit

      - name: ESLint
        run: npm run lint || true

      - name: Build (Vite)
        run: npm run build
        env:
          VITE_API_BASE_URL: http://localhost:8000

# ─── Frontend — Vitest Unit Tests ─────────────────────────────────────────────
  frontend-test:
    name: Frontend — Vitest Unit Tests
    runs-on: ubuntu-latest
    needs: frontend-build

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run Vitest
        run: npm run test -- --reporter=verbose --reporter=junit --outputFile=test-results/vitest.xml

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frontend-test-results
          path: frontend/test-results/
          retention-days: 14

# ─── Security — SAST + Dependency Audit ───────────────────────────────────────
  security-scan:
    name: Security — SAST & Dependency Audit
    runs-on: ubuntu-latest
    if: github.event_name == 'push'

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      # Python dependency CVE scan
      - name: pip-audit
        run: |
          pip install pip-audit
          pip-audit -r backend/requirements/production.txt \
            --ignore-vuln PYSEC-2022-43012 \
            || true

      # Python SAST — report findings, never block the pipeline.
      # Review the uploaded bandit-report.json artifact in the Actions tab.
      - name: Bandit SAST
        run: |
          pip install bandit
          bandit -r backend/apps/ -ll -x backend/apps/*/migrations/ \
            -f json -o bandit-report.json || true
          bandit -r backend/apps/ -ll -x backend/apps/*/migrations/ \
            --quiet || true

      - name: Upload Bandit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bandit-report
          path: bandit-report.json
          retention-days: 14

      # Node dependency CVE scan
      - name: npm audit
        working-directory: frontend
        run: npm audit --audit-level=high || true

# ─── Deploy — Backend (Railway) ───────────────────────────────────────────────
# Runs only on push to main after all checks pass.
# Requires these GitHub secrets:
#   RAILWAY_TOKEN              — Railway project token (Settings → Tokens)
#   RAILWAY_BACKEND_SERVICE    — Service name as shown in Railway dashboard
#   BACKEND_HEALTH_URL         — Full URL e.g. https://api.audity.com/api/v1/health/
# See .github/SECRETS.md for full setup guide.
  deploy-backend:
    name: Deploy — Backend → Railway
    runs-on: ubuntu-latest
    # e2e-smoke runs against the CURRENT live production stack (Railway
    # auto-deployed the new code on push). Only promote if smoke passes.
    needs: [backend-test, frontend-build, security-scan, e2e-smoke]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment: production
    # Non-fatal: Railway GitHub integration already auto-deploys on push.
    # This job re-deploys only when RAILWAY_TOKEN is configured, and its
    # failure must never block downstream jobs.
    continue-on-error: true

    # Keep deploys serialised — never cancel a deploy in-flight.
    concurrency:
      group: deploy-production-backend
      cancel-in-progress: false

    steps:
      # Gracefully skip the whole job when Railway secrets are not yet configured.
      # Once RAILWAY_TOKEN is added to GitHub Secrets, deploys activate automatically.
      - name: Check Railway credentials
        id: preflight
        run: |
          if [ -z "$RAILWAY_TOKEN" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Deploy Skipped::RAILWAY_TOKEN not configured — skipping deployment. See .github/SECRETS.md to set up Railway."
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}

      - uses: actions/checkout@v4
        if: steps.preflight.outputs.configured == 'true'

      - name: Install Railway CLI
        if: steps.preflight.outputs.configured == 'true'
        run: npm install -g @railway/cli@latest

      - name: Deploy to Railway
        if: steps.preflight.outputs.configured == 'true'
        # Railway CLI v3: `railway up` uploads + deploys. `--detach` returns
        # immediately so CI doesn't block waiting for the rollout to finish.
        # RAILWAY_SERVICE_NAME is the env-var form; --service flag is the flag form.
        working-directory: backend
        run: |
          railway up \
            --service "${{ secrets.RAILWAY_BACKEND_SERVICE }}" \
            --environment production \
            --detach
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}

      # Verify rollout — poll health endpoint; non-fatal if Railway is slow to wake.
      - name: Verify deployment health
        if: steps.preflight.outputs.configured == 'true'
        continue-on-error: true
        run: |
          echo "Waiting 45 s for Railway to roll out..."
          sleep 45
          HEALTH_URL="${{ secrets.BACKEND_HEALTH_URL }}"
          if [ -z "$HEALTH_URL" ]; then
            HEALTH_URL="https://audity-backend-production-30f9.up.railway.app/api/v1/health/"
          fi
          for i in 1 2 3; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 15 "$HEALTH_URL" || echo "000")
            echo "Health check $i/3: HTTP $STATUS"
            [ "$STATUS" = "200" ] && echo "✓ Backend healthy" && exit 0
            sleep 15
          done
          echo "::warning title=Health Check::Backend health check did not return 200 — check Railway dashboard."
          exit 0

# ─── Build — Tauri Desktop (Windows) ──────────────────────────────────────────
# Runs only on version tags (v*.*.*) — NOT on every push to main.
# This keeps installers private until a deliberate release tag is pushed.
#
# On launch day:
#   git tag v1.0.0 && git push origin v1.0.0
#
# Requires these GitHub secrets:
#   VITE_API_BASE_URL                  — Production API URL
#   TAURI_SIGNING_PRIVATE_KEY          — Base64 private key (tauri signer generate)
#   TAURI_SIGNING_PRIVATE_KEY_PASSWORD — Passphrase for the key above
  build-desktop:
    name: Build — Desktop (Windows)
    runs-on: windows-latest
    needs: [frontend-build]
    # Only build + publish installers when a version tag is pushed.
    # Keeps .exe / .msi private on this public repo until launch.
    if: startsWith(github.ref, 'refs/tags/v')

    concurrency:
      group: build-desktop-${{ github.ref }}
      cancel-in-progress: false

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      # Cache Rust build artifacts — cuts build time by ~60 % on cache hit.
      - name: Cache Rust artifacts
        uses: swatinem/rust-cache@v2
        with:
          workspaces: frontend/src-tauri -> target
          cache-on-failure: true

      - name: Install Node dependencies
        run: npm ci

      - name: Build Tauri app
        # tauri:build:cloud always targets the Railway production API (via .env.cloud)
        run: npm run tauri:build:cloud
        env:
          # Tauri v2 update signing — safe to omit if auto-update not configured yet.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: Upload MSI installer
        uses: actions/upload-artifact@v4
        with:
          name: audity-windows-msi
          # *.msi* not *.msi — Tauri writes the updater signature alongside the
          # installer as <name>.msi.sig, and the narrower glob silently dropped
          # it. Without that signature the updater manifest cannot be built and
          # desktop clients never see the release.
          path: frontend/src-tauri/target/release/bundle/msi/*.msi*
          if-no-files-found: error
          retention-days: 90

      - name: Upload NSIS setup
        uses: actions/upload-artifact@v4
        with:
          name: audity-windows-nsis
          # *.exe* to include the accompanying .exe.sig — see the MSI note above.
          path: frontend/src-tauri/target/release/bundle/nsis/*.exe*
          if-no-files-found: error
          retention-days: 90

# ─── E2E — Playwright smoke suite ────────────────────────────────────────────
# Runs after deploy-backend completes so it tests the freshly deployed stack.
# Requires these GitHub secrets:
#   TEST_EMAIL      — email of a real account on Railway production
#   TEST_PASSWORD   — password for that account
# BASE_URL is hardcoded to the Vercel frontend URL (no secret needed).
  e2e-smoke:
    name: E2E — Playwright Smoke
    runs-on: ubuntu-latest
    # Railway auto-deploys via GitHub integration on push to main, so we do
    # NOT depend on deploy-backend here — that job is a fallback for manual
    # token-based deploys and can fail without blocking E2E.
    # The warmup step below polls until Railway's new deployment is live.
    needs: [backend-test, frontend-build]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    defaults:
      run:
        working-directory: tests/e2e

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: tests/e2e/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      # ── 1. Wake the Railway backend ─────────────────────────────────────────
      # Railway's free tier sleeps after inactivity; cold-start takes ~20 s.
      # We poll the health endpoint up to 8 times (120 s total).
      - name: Warm up Railway backend
        run: |
          API="https://audity-backend-production-30f9.up.railway.app/api/v1/health/"
          echo "Polling Railway backend at $API …"
          for i in $(seq 1 8); do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 20 "$API" || echo "000")
            echo "  attempt $i/8: HTTP $STATUS"
            [ "$STATUS" = "200" ] && echo "  ✓ Backend healthy — proceeding" && break
            [ "$i" = "8" ] && echo "  ⚠ Backend did not return 200 after 8 attempts — tests may time out" && true
            sleep 15
          done

      # ── 2. Wait for Vercel to finish deploying the latest commit ────────────
      # Railway's GitHub integration auto-deploys on push; Vercel does too, but
      # both happen ASYNC relative to this CI job. We poll the Vercel preview URL
      # for up to 3 min so E2E tests always hit freshly deployed code.
      - name: Wait for Vercel frontend deployment
        run: |
          VERCEL_URL="https://audity-git-main-auditytechnologies.vercel.app"
          echo "Polling Vercel frontend at $VERCEL_URL …"
          for i in $(seq 1 12); do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 15 "$VERCEL_URL" || echo "000")
            BODY=$(curl -s --max-time 10 "$VERCEL_URL" 2>/dev/null | head -c 500)
            echo "  attempt $i/12: HTTP $STATUS"
            # 200 + HTML content (not Vercel 404) = deployment live
            if [ "$STATUS" = "200" ] && echo "$BODY" | grep -qi "html"; then
              echo "  ✓ Vercel frontend live — proceeding"
              break
            fi
            [ "$i" = "12" ] && echo "  ⚠ Vercel not ready after 12 attempts — E2E tests will skip frontend assertions gracefully"
            sleep 15
          done

      - name: Run smoke tests
        run: npm run test:smoke
        env:
          BASE_URL: https://audity-git-main-auditytechnologies.vercel.app
          API_URL: https://audity-backend-production-30f9.up.railway.app
          TEST_EMAIL: ${{ secrets.TEST_EMAIL }}
          TEST_PASSWORD: ${{ secrets.TEST_PASSWORD }}

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: tests/e2e/playwright-report/
          retention-days: 14

# ─── Release — GitHub (version tags only) ─────────────────────────────────────
# Push a tag like `v1.0.0` to trigger a GitHub Release with both installers.
# Pre-release tags: v1.0.0-beta, v1.0.0-rc1, v1.0.0-alpha
  create-release:
    name: GitHub Release
    runs-on: ubuntu-latest
    needs: [build-desktop]
    if: startsWith(github.ref, 'refs/tags/v')

    # This job writes to the repo (creates a release).
    permissions:
      contents: write

    concurrency:
      group: github-release-${{ github.ref }}
      cancel-in-progress: false

    steps:
      - uses: actions/checkout@v4

      - name: Download MSI
        uses: actions/download-artifact@v4
        with:
          name: audity-windows-msi
          path: dist/

      - name: Download NSIS setup
        uses: actions/download-artifact@v4
        with:
          name: audity-windows-nsis
          path: dist/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          fail_on_unmatched_files: true
          draft: false
          prerelease: >-
            ${{
              contains(github.ref_name, '-alpha') ||
              contains(github.ref_name, '-beta')  ||
              contains(github.ref_name, '-rc')
            }}

# ─── Build — Backend image → ECR (AWS migration) ──────────────────────────────
# Why here and not locally: Avast's TLS interception on the dev machine breaks
# HTTPS fetches inside the Docker build (the postgresql-client apt-key step
# fails with curl exit 60). This is also where Phase 6 of the migration plan
# puts builds permanently.
#
# Scope is deliberately narrow: BUILD and PUSH only, no deploy. Rolling the ECS
# services stays with Terraform, which owns the task definitions and the
# image_tag variable — so CI and Terraform never fight over task-definition
# revisions.
#
# Auth is OIDC; no AWS keys live in GitHub. The role ARN is not a secret, and
# trust is scoped in infra/terraform/github_oidc.tf to this repo and branch.
#
# The Railway deploy job above is intentionally untouched: Railway must keep
# serving desktop/mobile clients that still have its hostname compiled in,
# until those clients have updated.
  build-backend-image:
    name: Build — Backend image → ECR
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/infra/aws-migration' || github.ref == 'refs/heads/main'

    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::222907083438:role/audity-github-deploy
          aws-region: eu-west-1

      - name: Log in to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      # ECR tags are immutable (infra/terraform/ecr.tf), so every build needs a
      # fresh tag; the commit SHA is that tag.
      - name: Build and push
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          REPOSITORY: audity-backend
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t "$REGISTRY/$REPOSITORY:$IMAGE_TAG" .
          docker push "$REGISTRY/$REPOSITORY:$IMAGE_TAG"

      - name: Deployment instructions
        run: |
          echo "::notice title=Image pushed::Deploy with: terraform apply -var image_tag=${{ github.sha }}"
