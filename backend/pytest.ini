[pytest]
DJANGO_SETTINGS_MODULE = config.settings.testing
testpaths = ../tests
python_files = tests.py test_*.py *_tests.py
python_classes = Test*
python_functions = test_*
addopts =
    --strict-markers
    -v
    --tb=short
    --cov=apps
    --cov-report=term-missing
markers =
    unit: Unit tests (no DB)
    integration: Integration tests (uses DB)
    slow: Slow tests
