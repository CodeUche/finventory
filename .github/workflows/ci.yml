name: CI / CD

# Minimum token permissions — jobs that need more declare it explicitly.
permissions:
  contents: read

on:
  push:
    branches: [main, develop]
    tags: ["v*.*.*"]
  pull_request:
    branches: [main, develop]

# Cancel in-progress CI runs when a new push arrives on the same ref.
# Deploy jobs use their own concurrency group (cancel-in-progress: false).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.13"
  NODE_VERSION: "20"

# ─── Backend — Lint ────────────────────────────────────────────────────────────
jobs:
  backend-lint:
    name: Backend — Lint & Type Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/requirements/development.txt

      - name: Install lint deps
        run: pip install flake8 black isort

      - name: flake8
        run: flake8 . --max-line-length=120 --exclude=migrations,venv --extend-ignore=E501,W503 || true

      - name: black (check only)
        run: black --check --line-length=120 . --exclude '/(migrations|venv)/' || true

      - name: isort (check only)
        run: isort --check-only --profile=black . || true

# ─── Backend — Tests ───────────────────────────────────────────────────────────
  backend-test:
    name: Backend — Tests & Coverage
    runs-on: ubuntu-latest
    needs: backend-lint

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: finventory_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: backend

    env:
      DJANGO_SETTINGS_MODULE: config.settings.testing
      DB_NAME: finventory_test
      DB_USER: test_user
      DB_PASSWORD: test_password
      DB_HOST: localhost
      DB_PORT: 5432
      REDIS_URL: redis://localhost:6379/0
      SECRET_KEY: ci-test-secret-key-not-for-production-use-at-all
      DEBUG: "False"

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/requirements/development.txt

      - name: Install dependencies
        run: pip install -r requirements/development.txt

      - name: Run migrations
        run: python manage.py migrate --no-input

      - name: Run tests with coverage
        run: |
          pytest \
            --cov=apps \
            --cov-report=xml \
            --cov-report=term-missing \
            --tb=short \
            -q

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        if: always()
        with:
          files: ./coverage.xml
          fail_ci_if_error: false

# ─── Frontend — Type Check & Build ────────────────────────────────────────────
  frontend-build:
    name: Frontend — Type Check & Build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: TypeScript type check
        run: npx tsc --noEmit

      - name: Build (Vite)
        run: npm run build
        env:
          VITE_API_BASE_URL: http://localhost:8000

# ─── Security — SAST + Dependency Audit ───────────────────────────────────────
  security-scan:
    name: Security — SAST & Dependency Audit
    runs-on: ubuntu-latest
    if: github.event_name == 'push'

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      # Python dependency CVE scan
      - name: pip-audit
        run: |
          pip install pip-audit
          pip-audit -r backend/requirements/production.txt \
            --ignore-vuln PYSEC-2022-43012 \
            || true

      # Python SAST — report findings, never block the pipeline.
      # Review the uploaded bandit-report.json artifact in the Actions tab.
      - name: Bandit SAST
        run: |
          pip install bandit
          bandit -r backend/apps/ -ll -x backend/apps/*/migrations/ \
            -f json -o bandit-report.json || true
          bandit -r backend/apps/ -ll -x backend/apps/*/migrations/ \
            --quiet || true

      - name: Upload Bandit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bandit-report
          path: bandit-report.json
          retention-days: 14

      # Node dependency CVE scan
      - name: npm audit
        working-directory: frontend
        run: npm audit --audit-level=high || true

# ─── Deploy — Backend (Railway) ───────────────────────────────────────────────
# Runs only on push to main after all checks pass.
# Requires these GitHub secrets:
#   RAILWAY_TOKEN              — Railway project token (Settings → Tokens)
#   RAILWAY_BACKEND_SERVICE    — Service name as shown in Railway dashboard
#   BACKEND_HEALTH_URL         — Full URL e.g. https://api.audity.com/api/v1/health/
# See .github/SECRETS.md for full setup guide.
  deploy-backend:
    name: Deploy — Backend → Railway
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-build, security-scan]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment: production

    # Keep deploys serialised — never cancel a deploy in-flight.
    concurrency:
      group: deploy-production-backend
      cancel-in-progress: false

    steps:
      # Gracefully skip the whole job when Railway secrets are not yet configured.
      # Once RAILWAY_TOKEN is added to GitHub Secrets, deploys activate automatically.
      - name: Check Railway credentials
        id: preflight
        run: |
          if [ -z "$RAILWAY_TOKEN" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Deploy Skipped::RAILWAY_TOKEN not configured — skipping deployment. See .github/SECRETS.md to set up Railway."
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}

      - uses: actions/checkout@v4
        if: steps.preflight.outputs.configured == 'true'

      - name: Install Railway CLI
        if: steps.preflight.outputs.configured == 'true'
        run: npm install -g @railway/cli@latest

      - name: Deploy to Railway
        if: steps.preflight.outputs.configured == 'true'
        run: |
          railway up \
            --service "${{ secrets.RAILWAY_BACKEND_SERVICE }}" \
            --environment production \
            --detach
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}

      # Verify rollout via Railway CLI — checks deployment status without
      # needing a separate health-check URL secret.
      - name: Verify deployment
        if: steps.preflight.outputs.configured == 'true'
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          echo "Waiting for Railway to finish rolling out..."
          sleep 30
          railway status --json 2>/dev/null | grep -q '"status":"SUCCESS"' \
            && echo "✓ Deployment succeeded" \
            || echo "::warning::Could not confirm deployment status — check Railway dashboard"

# ─── Build — Tauri Desktop (Windows) ──────────────────────────────────────────
# Runs on push to main AND on version tags (for GitHub Release).
# Requires these GitHub secrets:
#   VITE_API_BASE_URL                  — Production API URL
#   TAURI_SIGNING_PRIVATE_KEY          — Base64 private key (tauri signer generate)
#   TAURI_SIGNING_PRIVATE_KEY_PASSWORD — Passphrase for the key above
  build-desktop:
    name: Build — Desktop (Windows)
    runs-on: windows-latest
    needs: [frontend-build]
    if: >
      github.event_name == 'push' &&
      (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/'))

    concurrency:
      group: build-desktop-${{ github.ref }}
      cancel-in-progress: false

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      # Cache Rust build artifacts — cuts build time by ~60 % on cache hit.
      - name: Cache Rust artifacts
        uses: swatinem/rust-cache@v2
        with:
          workspaces: frontend/src-tauri -> target
          cache-on-failure: true

      - name: Install Node dependencies
        run: npm ci

      - name: Build Tauri app
        run: npm run tauri:build
        env:
          VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL }}
          # Tauri v2 update signing — safe to omit if auto-update not configured yet.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: Upload MSI installer
        uses: actions/upload-artifact@v4
        with:
          name: audity-windows-msi
          path: frontend/src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error
          retention-days: 30

      - name: Upload NSIS setup
        uses: actions/upload-artifact@v4
        with:
          name: audity-windows-nsis
          path: frontend/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 30

# ─── Release — GitHub (version tags only) ─────────────────────────────────────
# Push a tag like `v1.0.0` to trigger a GitHub Release with both installers.
# Pre-release tags: v1.0.0-beta, v1.0.0-rc1, v1.0.0-alpha
  create-release:
    name: GitHub Release
    runs-on: ubuntu-latest
    needs: [build-desktop, deploy-backend]
    if: startsWith(github.ref, 'refs/tags/v')

    # This job writes to the repo (creates a release).
    permissions:
      contents: write

    concurrency:
      group: github-release-${{ github.ref }}
      cancel-in-progress: false

    steps:
      - uses: actions/checkout@v4

      - name: Download MSI
        uses: actions/download-artifact@v4
        with:
          name: audity-windows-msi
          path: dist/

      - name: Download NSIS setup
        uses: actions/download-artifact@v4
        with:
          name: audity-windows-nsis
          path: dist/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          fail_on_unmatched_files: true
          draft: false
          prerelease: >-
            ${{
              contains(github.ref_name, '-alpha') ||
              contains(github.ref_name, '-beta')  ||
              contains(github.ref_name, '-rc')
            }}
