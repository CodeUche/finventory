# blackbox_exporter modules — used for uptime / health probing.
modules:
  http_2xx:
    prober: http
    timeout: 5s
    http:
      valid_http_versions: ["HTTP/1.1", "HTTP/2.0"]
      valid_status_codes: []          # defaults to 2xx
      method: GET
      follow_redirects: true
      preferred_ip_protocol: ip4
      # The host intercepts TLS (its CA isn't in the container trust store), which
      # makes the HTTPS health probe fail cert verification. The endpoint is a
      # trusted public URL, so skip verification for the uptime probe.
      tls_config:
        insecure_skip_verify: true
