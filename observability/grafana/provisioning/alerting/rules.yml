# Grafana unified alerting — provisioned rules for Audity (production).
# Loaded automatically from /etc/grafana/provisioning/alerting.
# Each rule: node A = the metric query (instant), node C = a threshold that fires
# the alert. All route to the "audity-default" contact point (see contactpoints.yml).
apiVersion: 1

groups:
  - orgId: 1
    name: audity-reliability
    folder: Audity Alerts
    interval: 1m
    rules:
      # ── 1. High 5xx error rate ───────────────────────────────
      - uid: audity-5xx-high
        title: High 5xx error rate (production)
        condition: C
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Backend 5xx error rate is above 5% for 5 minutes."
          description: "5xx ratio = {{ printf \"%.2f\" (mul $values.A.Value 100) }}% on the production backend."
        noDataState: OK
        execErrState: Alerting
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: prometheus
            model:
              refId: A
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
              datasource: { type: prometheus, uid: prometheus }
              expr: 'sum(rate(django_http_responses_total_by_status_total{env="production",status=~"5.."}[5m])) / clamp_min(sum(rate(django_http_responses_total_by_status_total{env="production"}[5m])), 1)'
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              datasource: { type: __expr__, uid: __expr__ }
              conditions:
                - evaluator: { type: gt, params: [0.05] }

      # ── 2. Backend down (production /metrics scrape failing) ──
      # Uses Prometheus' own scrape-health signal (up==1 when /metrics is
      # reachable) rather than the blackbox probe — more reliable, and it works
      # even from networks that intercept TLS / block direct-IP HTTPS.
      - uid: audity-backend-down
        title: Backend down (production)
        condition: C
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Production backend /metrics scrape is failing."
          description: "up{job=\"django-production\"} = 0 — Prometheus cannot reach the backend."
        noDataState: Alerting
        execErrState: Alerting
        data:
          - refId: A
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: prometheus
            model:
              refId: A
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
              datasource: { type: prometheus, uid: prometheus }
              expr: 'min(up{job="django-production"})'
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              datasource: { type: __expr__, uid: __expr__ }
              conditions:
                - evaluator: { type: lt, params: [1] }

      # ── 3. Database down ─────────────────────────────────────
      - uid: audity-db-down
        title: Database down
        condition: C
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "PostgreSQL is unreachable (pg_up = 0)."
          description: "postgres-exporter cannot reach the database it monitors."
        noDataState: Alerting
        execErrState: Alerting
        data:
          - refId: A
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: prometheus
            model:
              refId: A
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
              datasource: { type: prometheus, uid: prometheus }
              expr: 'max(pg_up)'
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              datasource: { type: __expr__, uid: __expr__ }
              conditions:
                - evaluator: { type: lt, params: [1] }

      # ── 4. High latency (p95) ────────────────────────────────
      - uid: audity-latency-high
        title: High p95 latency (production)
        condition: C
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "p95 request latency above 2s for 10 minutes."
          description: "p95 = {{ printf \"%.3f\" $values.A.Value }}s on the production backend."
        noDataState: OK
        execErrState: Alerting
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: prometheus
            model:
              refId: A
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
              datasource: { type: prometheus, uid: prometheus }
              expr: 'histogram_quantile(0.95, sum by (le) (rate(django_http_requests_latency_seconds_by_view_method_bucket{env="production"}[5m])))'
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              datasource: { type: __expr__, uid: __expr__ }
              conditions:
                - evaluator: { type: gt, params: [2] }

      # ── 5. Traffic flatline (no requests) ────────────────────
      - uid: audity-traffic-flatline
        title: No production traffic
        condition: C
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "No requests reaching the production backend for 10 minutes."
          description: "Request rate is ~0 — the backend may be unreachable or scraping is broken."
        # Fire on missing data / eval errors too: if scraping breaks the series
        # disappears, and this alert is meant to catch exactly that.
        noDataState: Alerting
        execErrState: Alerting
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: prometheus
            model:
              refId: A
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
              datasource: { type: prometheus, uid: prometheus }
              expr: 'sum(rate(django_http_requests_total_by_method_total{env="production"}[5m]))'
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              datasource: { type: __expr__, uid: __expr__ }
              conditions:
                - evaluator: { type: lt, params: [0.0001] }
