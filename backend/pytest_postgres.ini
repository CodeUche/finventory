; Postgres-backed integration tests — the only configuration where row-level
; security is actually exercised (see config/settings/testing_postgres.py).
;
; The default pytest.ini runs on SQLite, which has no RLS, so tenant-isolation
; policies are invisible to it. Run this separately:
;
;     docker compose up -d db
;     pytest -c pytest_postgres.ini apps/core/test_rls_integration.py
;
[pytest]
DJANGO_SETTINGS_MODULE = config.settings.testing_postgres
testpaths = apps
pythonpath = .
python_files = tests.py tests_*.py test_*.py *_tests.py *_e2e.py
python_classes = Test*
python_functions = test_*
addopts =
    --strict-markers
    --tb=short
markers =
    unit: Unit tests (no DB, no I/O — pure logic)
    integration: Integration tests (uses DB, may call services)
    api: Full API endpoint tests via APIClient
    slow: Slow tests (> 5 s)
    smoke: Smoke tests — critical path, included in pre-deploy run
    rls: Row-level-security tests — require PostgreSQL, skipped on SQLite
