version: "3.9"

# ============================================================
# Finventory Development Docker Compose
# ============================================================
# Usage:
#   docker-compose up -d           # Start all services
#   docker-compose exec api bash   # Shell into API container
#   docker-compose logs -f api     # Tail API logs

services:

  # ─── PostgreSQL ─────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: ${DB_NAME:-finventory}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-finv_app}"]
      interval: 10s
      timeout: 5s
      retries: 5
    ports:
      - "5432:5432"

  # ─── Redis ──────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
    ports:
      - "6379:6379"

  # ─── Django API ──────────────────────────────────────────────
  api:
    build:
      context: .
      target: builder    # Use builder stage in dev (includes dev tools)
    restart: unless-stopped
    volumes:
      - ./backend:/app/backend    # Live reload via volume mount
      - media_data:/app/backend/media
    env_file:
      - .env
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.development
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: >
      sh -c "
        python manage.py migrate --noinput &&
        python manage.py runserver 0.0.0.0:8000
      "

  # ─── Celery Worker ────────────────────────────────────────────
  celery:
    build:
      context: .
      target: builder
    restart: unless-stopped
    volumes:
      - ./backend:/app/backend
    env_file:
      - .env
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.development
    depends_on:
      - db
      - redis
    command: >
      sh -c "celery -A config.celery worker --loglevel=info"

  # ─── Celery Beat (Scheduled tasks) ───────────────────────────
  celery-beat:
    build:
      context: .
      target: builder
    restart: unless-stopped
    volumes:
      - ./backend:/app/backend
    env_file:
      - .env
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.development
    depends_on:
      - db
      - redis
    command: >
      sh -c "celery -A config.celery beat --loglevel=info --scheduler django_celery_beat.schedulers:DatabaseScheduler"

volumes:
  postgres_data:
  redis_data:
  media_data:
