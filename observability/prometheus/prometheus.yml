# Prometheus scrape configuration for the Audity observability stack.
# Targets use host.docker.internal so they reach services on the host machine
# (Django + Postgres), regardless of how those are started.

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    app: audity

scrape_configs:
  # ─── Prometheus self-monitoring ─────────────────────────────
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  # ─── Django application metrics (django-prometheus /metrics) ─
  - job_name: django-local
    metrics_path: /metrics
    static_configs:
      - targets: ["host.docker.internal:8000"]
        labels:
          service: backend
          env: local

  # ─── Django production metrics (Railway) ─────────────────────
  - job_name: django-production
    metrics_path: /metrics
    scheme: https
    # The host machine intercepts TLS (corporate/AV proxy injects its own CA),
    # so the container can't verify the public Railway cert. Metrics scraping
    # over an already-trusted public endpoint — skipping verification is fine here.
    tls_config:
      insecure_skip_verify: true
    static_configs:
      - targets: ["audity-backend-production-30f9.up.railway.app"]
        labels:
          service: backend
          env: production

  # ─── Uptime — Railway production health ──────────────────────
  - job_name: blackbox-production
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets:
          - https://audity-backend-production-30f9.up.railway.app/api/v1/health/
        labels:
          service: uptime
          env: production
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115

  # ─── PostgreSQL metrics (postgres_exporter) ─────────────────
  # Longer interval/timeout: the exporter queries the prod DB over Railway's
  # public TCP proxy, so collector round-trips are slower than a local DB.
  - job_name: postgres
    scrape_interval: 30s
    scrape_timeout: 25s
    static_configs:
      - targets: ["postgres-exporter:9187"]
        labels:
          service: database

  # ─── Uptime / health checks (blackbox_exporter, HTTP probe) ─
  - job_name: blackbox-http
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets:
          - http://host.docker.internal:8000/api/v1/health/
        labels:
          service: uptime
          env: local
    relabel_configs:
      # Standard blackbox relabel: pass the target as the ?target= param and
      # point the actual scrape at the blackbox_exporter.
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115
