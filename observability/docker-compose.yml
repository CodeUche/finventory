# ============================================================
# Finventory / Audity — Observability stack (Grafana)
# ============================================================
# A self-contained monitoring stack: Prometheus (metrics), Loki + Promtail
# (logs), postgres_exporter (DB metrics), blackbox_exporter (uptime), and
# Grafana (dashboards) — all pre-provisioned.
#
# Usage:
#   cd finventory/observability
#   cp .env.example .env          # then edit DB creds if needed
#   docker compose up -d
#   open http://localhost:3001    # Grafana (admin / admin by default)
#
# It scrapes whatever runs on the HOST machine via host.docker.internal, so it
# works whether you run Django via the venv (manage.py runserver) or in Docker,
# and Postgres via the main compose. No need to share networks.
#
# To monitor PRODUCTION (Railway) instead, see README.md → "Monitoring prod".
# ============================================================

name: audity-observability

x-host-gateway: &host-gateway
  extra_hosts:
    - "host.docker.internal:host-gateway"   # Linux compatibility (no-op on Docker Desktop)

services:

  # ─── Prometheus — metrics collection ─────────────────────────
  prometheus:
    image: prom/prometheus:v2.54.1
    restart: unless-stopped
    <<: *host-gateway
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=15d"
    ports:
      - "9090:9090"

  # ─── postgres_exporter — PostgreSQL metrics ──────────────────
  postgres-exporter:
    image: quay.io/prometheuscommunity/postgres-exporter:v0.15.0
    restart: unless-stopped
    <<: *host-gateway
    environment:
      # Monitors the PRODUCTION Railway Postgres so pg_up / connections / cache-hit
      # panels + the "Database down" alert reflect prod. Split URI/USER/PASS form
      # avoids URL-encoding issues with special chars in the password (#, +, * etc.).
      # Railway requires SSL → sslmode=require. Falls back to the local host DB if
      # AUDIT_DB_* is unset.
      DATA_SOURCE_URI: "${AUDIT_DB_HOST:-host.docker.internal}:${AUDIT_DB_PORT:-5432}/${AUDIT_DB_NAME:-finventory}?sslmode=${AUDIT_DB_SSLMODE:-require}"
      DATA_SOURCE_USER: "${AUDIT_DB_USER:-finv_app}"
      DATA_SOURCE_PASS: "${AUDIT_DB_PASSWORD:-postgres}"
    # Disable collectors that are slow over the public proxy and/or incompatible
    # with Postgres 18 (pg_stat_bgwriter columns moved; pg_ls_waldir needs perms).
    # The dashboards only use pg_up + pg_stat_database + database size/activity.
    command:
      - "--no-collector.wal"
      - "--no-collector.stat_bgwriter"
      - "--no-collector.replication"
      - "--no-collector.replication_slot"
    ports:
      - "9187:9187"

  # ─── blackbox_exporter — uptime / health probing ─────────────
  blackbox-exporter:
    image: prom/blackbox-exporter:v0.25.0
    restart: unless-stopped
    <<: *host-gateway
    volumes:
      - ./blackbox/blackbox.yml:/etc/blackbox_exporter/config.yml:ro
    command:
      - "--config.file=/etc/blackbox_exporter/config.yml"
    ports:
      - "9115:9115"

  # ─── Loki — log aggregation ──────────────────────────────────
  loki:
    image: grafana/loki:3.1.1
    restart: unless-stopped
    volumes:
      - ./loki/loki-config.yml:/etc/loki/local-config.yaml:ro
      - loki_data:/loki
    command: -config.file=/etc/loki/local-config.yaml
    ports:
      - "3100:3100"

  # ─── Promtail — ships Django logs into Loki ──────────────────
  promtail:
    image: grafana/promtail:3.1.1
    restart: unless-stopped
    volumes:
      - ./promtail/promtail-config.yml:/etc/promtail/config.yml:ro
      # Mount the Django log directory (read-only) so Promtail can tail it.
      - ../backend/logs:/var/log/finventory:ro
    command: -config.file=/etc/promtail/config.yml
    depends_on:
      - loki

  # ─── Grafana — dashboards ────────────────────────────────────
  grafana:
    image: grafana/grafana:11.2.0
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GF_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GF_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      # ── Audit Postgres datasource (Business Activity dashboards) → prod Railway DB.
      #    Interpolated into grafana/provisioning/datasources/datasources.yml.
      AUDIT_DB_HOST: ${AUDIT_DB_HOST:-host.docker.internal}
      AUDIT_DB_PORT: ${AUDIT_DB_PORT:-5432}
      AUDIT_DB_NAME: ${AUDIT_DB_NAME:-finventory}
      AUDIT_DB_USER: ${AUDIT_DB_USER:-finv_app}
      AUDIT_DB_PASSWORD: ${AUDIT_DB_PASSWORD:-postgres}
      # ── Alert email delivery (optional): fill these to receive alert notifications.
      GF_SMTP_ENABLED: ${GF_SMTP_ENABLED:-false}
      GF_SMTP_HOST: ${GF_SMTP_HOST:-}
      GF_SMTP_USER: ${GF_SMTP_USER:-}
      GF_SMTP_PASSWORD: ${GF_SMTP_PASSWORD:-}
      GF_SMTP_FROM_ADDRESS: ${GF_SMTP_FROM_ADDRESS:-alerts@audity.app}
      GF_SMTP_FROM_NAME: ${GF_SMTP_FROM_NAME:-Audity Grafana}
      ALERT_EMAIL_TO: ${ALERT_EMAIL_TO:-alerts@audity.app}
      # ── Grafana Cloud Loki (production logs) — interpolated into datasources.yml.
      GRAFANA_CLOUD_LOKI_URL: ${GRAFANA_CLOUD_LOKI_URL:-}
      GRAFANA_CLOUD_LOKI_USER: ${GRAFANA_CLOUD_LOKI_USER:-}
      GRAFANA_CLOUD_LOKI_TOKEN: ${GRAFANA_CLOUD_LOKI_TOKEN:-}
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    ports:
      - "3001:3000"   # 3001 on host to avoid clashing with the Vite dev server
    depends_on:
      - prometheus
      - loki

volumes:
  prometheus_data:
  grafana_data:
  loki_data:
