# Railway build configuration
# This file tells Railway how to build and run your app

[phases.setup]
nixPkgs = ["python313", "nodejs_20"]

[phases.install]
cmds = [
    "pip install -r backend/requirements/production.txt",
]

[start]
cmd = "cd backend && DJANGO_SETTINGS_MODULE=config.settings.production python manage.py migrate --no-input && gunicorn config.wsgi:application --bind 0.0.0.0:$PORT --workers 2 --timeout 120"
