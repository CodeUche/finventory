[pytest]
DJANGO_SETTINGS_MODULE = config.settings.testing
testpaths = apps
pythonpath = .
; `tests_*.py` matters: apps/payroll/tests_hr.py holds 90 tests and matched
; none of the other patterns (test_*.py needs an underscore at position 5;
; "tests_hr.py" has an "s"). Django's own runner discovers it, pytest's
; directory sweep did not, so those 90 tests never ran in CI or in any local
; pytest run — while still passing under `manage.py test`, which is why the
; gap went unnoticed. See NEW-13.
python_files = tests.py tests_*.py test_*.py *_tests.py *_e2e.py
python_classes = Test*
python_functions = test_*
addopts =
    --strict-markers
    --tb=short
    --failed-first
markers =
    unit: Unit tests (no DB, no I/O — pure logic)
    integration: Integration tests (uses DB, may call services)
    api: Full API endpoint tests via APIClient
    slow: Slow tests (> 5 s)
    smoke: Smoke tests — critical path, included in pre-deploy run
    rls: Row-level-security tests — require PostgreSQL, skipped on SQLite
